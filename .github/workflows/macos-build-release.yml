name: macOS Native Desktop Validation

on:
  workflow_call:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install validation tools
        run: brew install ninja

      - name: Configure, build and test arm64 candidate
        run: |
          test "$(uname -m)" = arm64
          cmake --preset macos-arm64 -DBUILD_TESTING=ON
          cmake --build build/macos-arm64 --parallel
          ctest --preset macos-arm64 --output-on-failure

      - name: Resolve version from CMake
        id: version
        run: |
          set -euo pipefail
          version_file="$RUNNER_TEMP/minebackup-version.txt"
          cmake -DMINEBACKUP_VERSION_OUTPUT="$version_file" \
            -P cmake/ExportMineBackupVersion.cmake
          version="$(tr -d '\r\n' < "$version_file")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $version"

      - name: Verify bundle metadata and architecture
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          app=build/macos-arm64/bin/MineBackup.app
          test -d "$app"
          plutil -lint "$app/Contents/Info.plist"
          test "$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")" = "io.github.leafuke.MineBackup"
          test "$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")" = "$VERSION"
          test "$(plutil -extract LSMinimumSystemVersion raw "$app/Contents/Info.plist")" = "15.0"
          lipo -info "$app/Contents/MacOS/MineBackup" | tee build/macos-arm64/lipo.txt
          grep -Fq 'arm64' build/macos-arm64/lipo.txt
          ! grep -Fq 'x86_64' build/macos-arm64/lipo.txt

      - name: Build pinned 7-Zip ZS for packaging
        if: matrix.runner == 'macos-15'
        run: |
          git init build/7zip-zstd
          git -C build/7zip-zstd remote add origin https://github.com/mcmilk/7-Zip-zstd.git
          git -C build/7zip-zstd fetch --depth 1 origin 2dcb6815c0e6877988171c47e1824b86172ff3b2
          git -C build/7zip-zstd checkout --detach FETCH_HEAD
          bash packaging/macos/build-sevenzip.sh \
            build/7zip-zstd build/package-inputs/7zz

      - name: Build ad-hoc signed DMG candidate
        if: matrix.runner == 'macos-15'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p build/release
          MINEBACKUP_CODESIGN_IDENTITY=- bash packaging/macos/build-dmg.sh \
            build/macos-arm64/bin/MineBackup.app \
            build/package-inputs/7zz build/release "$VERSION"
          test -f "build/release/MineBackup-${VERSION}-macos-arm64.dmg"

      - name: Create macOS cross-restore fixtures
        if: matrix.runner == 'macos-15'
        run: |
          mkdir -p build/cross-restore
          cp build/package-inputs/7zz build/cross-restore/7zz
          printf %s 'MineBackup 1.16 cross-restore fixture: macos' >build/cross-restore/macos.txt
          build/cross-restore/7zz a -y -t7z -m0=lzma2 \
            build/cross-restore/macos-lzma2.7z build/cross-restore/macos.txt
          build/cross-restore/7zz a -y -t7z -m0=zstd \
            build/cross-restore/macos-zstd.7z build/cross-restore/macos.txt

      - name: Run from a read-only app bundle
        run: |
          app=build/macos-arm64/bin/MineBackup.app
          profile="$RUNNER_TEMP/minebackup-profile-${{ matrix.runner }}"
          chmod -R a-w "$app"
          "$app/Contents/MacOS/MineBackup" --data-dir "$profile" \
            >build/macos-arm64/smoke.log 2>&1 &
          pid=$!
          sleep 8
          if ! kill -0 "$pid" 2>/dev/null; then
            cat build/macos-arm64/smoke.log
            exit 1
          fi
          kill -TERM "$pid"
          wait "$pid" || true
          test -d "$profile/config"
          test ! -w "$app"

      - name: Upload macOS release candidate
        if: matrix.runner == 'macos-15'
        uses: actions/upload-artifact@v4
        with:
          name: minebackup-macos-candidate
          if-no-files-found: error
          retention-days: 14
          path: |
            build/release/MineBackup-${{ steps.version.outputs.version }}-macos-arm64.dmg

      - name: Upload macOS cross-restore fixtures
        if: matrix.runner == 'macos-15'
        uses: actions/upload-artifact@v4
        with:
          name: minebackup-macos-restore-fixtures
          path: build/cross-restore
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload macOS validation logs
        uses: actions/upload-artifact@v4
        with:
          name: minebackup-${{ matrix.runner }}-validation-logs
          if-no-files-found: error
          retention-days: 14
          path: |
            build/macos-arm64/lipo.txt
            build/macos-arm64/smoke.log

name: Windows Signed Release Candidate

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-and-sign:
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Verify tracked Windows 7-Zip resource
      shell: pwsh
      run: .\cmake\VerifyWindowsSevenZip.ps1

    - name: Build and verify CMake MSVC shadow candidate
      shell: pwsh
      run: |
        cmake --preset windows-msvc-x64
        cmake --build --preset windows-msvc-x64-release
        ctest --preset windows-msvc-x64-release --output-on-failure
        .\cmake\VerifyWindowsArtifact.ps1 -Executable .\build\windows-msvc-x64\bin\Release\MineBackup.exe
        .\cmake\SmokeTestWindowsArtifact.ps1 -Executable .\build\windows-msvc-x64\bin\Release\MineBackup.exe
        cmake --build --preset windows-msvc-x64-release --target check_msbuild_source_parity

    - name: Build Release x64
      shell: pwsh
      run: |
        msbuild .\MineBackup.sln /p:Configuration=Release /p:Platform=x64 /m

    - name: Collect unsigned executables
      shell: pwsh
      run: |
        Start-Sleep -Seconds 3
        $desktopCandidates = @(
          '.\x64\Release\MineBackup.exe'
        )

        $desktopPath = $desktopCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
        if (-not $desktopPath) {
          $found = Get-ChildItem -Path . -Filter MineBackup.exe -Recurse -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if ($found) {
            $desktopPath = $found.FullName
          }
        }

        if (-not $desktopPath) {
          throw 'MineBackup.exe not found after build.'
        }

        $cliCandidates = @(
          '.\build\windows-msvc-x64\bin\Release\minebackup-cli.exe'
        )
        $cliPath = $cliCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
        if (-not $cliPath) {
          throw 'minebackup-cli.exe not found after build.'
        }

        New-Item -ItemType Directory -Path .\out\unsigned -Force | Out-Null
        New-Item -ItemType Directory -Path .\out\unsigned-cli -Force | Out-Null
        Copy-Item -Path $desktopPath -Destination .\out\unsigned\MineBackup.exe -Force
        # 复用现有 SignPath artifact configuration；签名后再恢复 CLI 的发布文件名。
        Copy-Item -Path $cliPath -Destination .\out\unsigned-cli\MineBackup.exe -Force
        Write-Host "Unsigned desktop artifact: $desktopPath"
        Write-Host "Unsigned CLI artifact: $cliPath"

    - name: Verify unsigned executable
      shell: pwsh
      run: |
        .\cmake\VerifyWindowsArtifact.ps1 -Executable .\out\unsigned\MineBackup.exe
        .\cmake\SmokeTestWindowsArtifact.ps1 -Executable .\out\unsigned\MineBackup.exe

    - name: Upload unsigned artifact
      id: upload_unsigned
      uses: actions/upload-artifact@v4
      with:
        name: minebackup-unsigned-windows
        path: .\out\unsigned\MineBackup.exe

    - name: Upload unsigned CLI artifact
      id: upload_unsigned_cli
      uses: actions/upload-artifact@v4
      with:
        name: minebackup-unsigned-windows-cli
        path: .\out\unsigned-cli\MineBackup.exe

    - name: Submit SignPath signing request
      id: signpath
      uses: signpath/github-action-submit-signing-request@v2
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
        signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        github-artifact-id: ${{ steps.upload_unsigned.outputs.artifact-id }}
        wait-for-completion: true
        output-artifact-directory: .\out\signed

    - name: Collect signed executable
      shell: pwsh
      run: |
        $signedCandidates = @(
          '.\out\signed\MineBackup.exe',
          '.\out\signed\x64\Release\MineBackup.exe'
        )

        $signedExe = $signedCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
        if (-not $signedExe) {
          $found = Get-ChildItem -Path .\out\signed -Filter MineBackup.exe -Recurse -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if ($found) {
            $signedExe = $found.FullName
          }
        }

        if (-not $signedExe) {
          throw 'Signed MineBackup.exe not found in SignPath output.'
        }

        New-Item -ItemType Directory -Path .\out\release -Force | Out-Null
        Copy-Item -Path $signedExe -Destination .\out\release\MineBackup-windows-x64.exe -Force
        Write-Host "Signed artifact: $signedExe"

    - name: Submit SignPath CLI signing request
      id: signpath_cli
      uses: signpath/github-action-submit-signing-request@v2
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
        signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        github-artifact-id: ${{ steps.upload_unsigned_cli.outputs.artifact-id }}
        wait-for-completion: true
        output-artifact-directory: .\out\signed-cli

    - name: Collect signed CLI executable
      shell: pwsh
      run: |
        $signedCli = Get-ChildItem -Path .\out\signed-cli -Filter MineBackup.exe -Recurse -File |
          Sort-Object LastWriteTime -Descending |
          Select-Object -First 1
        if (-not $signedCli) {
          throw 'Signed CLI MineBackup.exe not found in SignPath output.'
        }
        Copy-Item -Path $signedCli.FullName -Destination .\out\release\minebackup-cli.exe -Force
        Write-Host "Signed CLI artifact: $($signedCli.FullName)"

    - name: Verify signed executable
      shell: pwsh
      run: |
        .\cmake\VerifyWindowsArtifact.ps1 -Executable .\out\release\MineBackup-windows-x64.exe
        .\cmake\SmokeTestWindowsArtifact.ps1 -Executable .\out\release\MineBackup-windows-x64.exe

    - name: Verify signed CLI executable
      shell: pwsh
      run: |
        $signature = Get-AuthenticodeSignature -LiteralPath .\out\release\minebackup-cli.exe
        if ($signature.Status -ne 'Valid') {
          throw "The packaged CLI is not Authenticode-signed: $($signature.Status)"
        }
        .\out\release\minebackup-cli.exe --version
        if ($LASTEXITCODE -ne 0) {
          throw 'Signed CLI executable failed its version smoke test.'
        }

    - name: Build headless Windows server candidate
      shell: pwsh
      run: |
        $versionFile = Join-Path $env:RUNNER_TEMP 'minebackup-version.txt'
        cmake "-DMINEBACKUP_VERSION_OUTPUT=$versionFile" `
          -P .\cmake\ExportMineBackupVersion.cmake
        $version = (Get-Content -LiteralPath $versionFile -Raw).Trim()
        .\packaging\cli\build-cli-windows.ps1 `
          -Executable .\out\release\minebackup-cli.exe `
          -OutputDirectory .\out\release `
          -Version $version `
          -RequireAuthenticodeSignature
        if (-not (Test-Path ".\out\release\MineBackup-CLI-$version-windows-x64.zip")) {
          throw 'Windows CLI package was not created.'
        }

    - name: Print SignPath links
      shell: pwsh
      run: |
        Write-Host "Signing Policy Slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}"
        Write-Host "Signing Request ID: ${{ steps.signpath.outputs.signing-request-id }}"
        Write-Host "Signing Request URL: ${{ steps.signpath.outputs.signing-request-web-url }}"
        Write-Host "Signed Download URL: ${{ steps.signpath.outputs.signed-artifact-download-url }}"
        Write-Host "CLI Signing Request ID: ${{ steps.signpath_cli.outputs.signing-request-id }}"
        Write-Host "CLI Signing Request URL: ${{ steps.signpath_cli.outputs.signing-request-web-url }}"
        Write-Host "CLI Signed Download URL: ${{ steps.signpath_cli.outputs.signed-artifact-download-url }}"

    - name: Upload signed Windows release candidate
      uses: actions/upload-artifact@v4
      with:
        name: minebackup-windows-candidate
        path: |
          .\out\release\MineBackup-windows-x64.exe
          .\out\release\MineBackup-CLI-*-windows-x64.zip
        if-no-files-found: error
        compression-level: 0
        retention-days: 14

    - name: Create Windows cross-restore fixtures
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path .\out\cross-restore -Force | Out-Null
        Set-Content -LiteralPath .\out\cross-restore\windows.txt `
          -Value 'MineBackup 1.16 cross-restore fixture: windows' -Encoding utf8 -NoNewline
        & .\MineBackup\Assets\7za.exe a -y -t7z -m0=lzma2 `
          .\out\cross-restore\windows-lzma2.7z .\out\cross-restore\windows.txt
        if ($LASTEXITCODE -ne 0) { throw 'Windows LZMA2 fixture creation failed.' }
        & .\MineBackup\Assets\7za.exe a -y -t7z -m0=zstd `
          .\out\cross-restore\windows-zstd.7z .\out\cross-restore\windows.txt
        if ($LASTEXITCODE -ne 0) { throw 'Windows zstd fixture creation failed.' }
        Copy-Item .\MineBackup\Assets\7za.exe .\out\cross-restore\7za.exe

    - name: Upload Windows cross-restore fixtures
      uses: actions/upload-artifact@v4
      with:
        name: minebackup-windows-restore-fixtures
        path: .\out\cross-restore
        if-no-files-found: error
        compression-level: 0
        retention-days: 14

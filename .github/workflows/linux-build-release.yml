name: Linux Build and Desktop Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build and desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config p7zip-full \
            libgl1-mesa-dev libcurl4-openssl-dev libglib2.0-dev \
            libgtk-3-dev libayatana-appindicator3-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols xvfb weston

      - name: Configure, build and test
        run: |
          cmake --preset linux-x64 -DBUILD_TESTING=ON
          cmake --build build/linux-x64 --parallel
          ctest --preset linux-x64 --output-on-failure

      - name: Verify declared dynamic libraries
        run: |
          ldd build/linux-x64/bin/MineBackup | tee build/linux-x64/ldd.txt
          ! grep -F 'not found' build/linux-x64/ldd.txt

      - name: Stage developer-smoke resources
        run: |
          mkdir -p build/linux-x64/bin/Resources/Assets
          cp MineBackup/Assets/fontawesome-sp.otf build/linux-x64/bin/Resources/Assets/

      - name: Exercise automatic X11 and Wayland selection
        run: bash packaging/linux/verify-desktop.sh build/linux-x64/bin/MineBackup all

      - name: Upload validation candidate
        uses: actions/upload-artifact@v4
        with:
          name: minebackup-linux-desktop-validation
          path: |
            build/linux-x64/bin/MineBackup
            build/linux-x64/ldd.txt

name: Linux Build and Desktop Validation

on:
  workflow_call:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build and desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-13 g++-13 cmake ninja-build pkg-config \
            python3-pil unzip curl \
            libgl1-mesa-dev libcurl4-openssl-dev libglib2.0-dev \
            libgtk-3-dev libayatana-appindicator3-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols xvfb weston

      - name: Install pinned 7-Zip ZS runtime
        run: |
          mkdir -p build/package-inputs
          curl --fail --location --retry 3 \
            https://github.com/mcmilk/7-Zip-zstd/releases/download/v26.02-v1.5.7-R2/linux-gcc-x64.zip \
            --output build/package-inputs/linux-gcc-x64.zip
          echo 'be246e5a284d3b5e738bad5cbb24c2662996ddb9776e09575b5099ab53fa0ba3  build/package-inputs/linux-gcc-x64.zip' \
            | sha256sum --check --status
          unzip -p build/package-inputs/linux-gcc-x64.zip 7zz \
            >build/package-inputs/7zz
          chmod 0755 build/package-inputs/7zz
          sudo install -m 0755 build/package-inputs/7zz /usr/local/bin/7zz

      - name: Configure, build and test
        run: |
          cmake --preset linux-x64 -DBUILD_TESTING=ON
          cmake --build build/linux-x64 --parallel
          python3 tests/verify_rc_tests.py --build build/linux-x64
          ctest --preset linux-x64 --output-on-failure

      - name: Resolve version from CMake
        id: version
        run: |
          set -euo pipefail
          version_file="$RUNNER_TEMP/minebackup-version.txt"
          cmake -DMINEBACKUP_VERSION_OUTPUT="$version_file" \
            -P cmake/ExportMineBackupVersion.cmake
          version="$(tr -d '\r\n' < "$version_file")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $version"

      - name: Verify declared dynamic libraries
        run: |
          ldd build/linux-x64/bin/MineBackup | tee build/linux-x64/ldd.txt
          ! grep -F 'not found' build/linux-x64/ldd.txt

      - name: Download pinned packaging inputs
        run: |
          mkdir -p build/release
          curl --fail --location --retry 3 \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage \
            --output build/package-inputs/linuxdeploy-x86_64.AppImage
          echo 'c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  build/package-inputs/linuxdeploy-x86_64.AppImage' \
            | sha256sum --check --status

      - name: Stage developer-smoke resources
        run: |
          tool_dir=build/linux-x64/bin/Resources/tools/7zip/26.02-zs-v1.5.7-r2
          mkdir -p build/linux-x64/bin/Resources/Assets "$tool_dir"
          cp MineBackup/Assets/fontawesome-sp.otf build/linux-x64/bin/Resources/Assets/
          cp MineBackup/Assets/tool-manifest.json build/linux-x64/bin/Resources/
          unzip -p build/package-inputs/linux-gcc-x64.zip 7zz >"$tool_dir/7zz"
          chmod 0755 "$tool_dir/7zz"

      - name: Exercise automatic X11 and Wayland selection
        run: bash packaging/linux/verify-desktop.sh build/linux-x64/bin/MineBackup all

      - name: Build deb and AppImage candidates
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          bash packaging/linux/build-packages.sh \
            build/linux-x64/bin/MineBackup build/release \
            build/package-inputs/linux-gcc-x64.zip \
            build/package-inputs/linuxdeploy-x86_64.AppImage \
            "$VERSION"
          test -f "build/release/minebackup_${VERSION}_amd64.deb"
          test -x "build/release/MineBackup-${VERSION}-x86_64.AppImage"

      - name: Build headless server candidates
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          bash packaging/cli/build-cli-linux.sh \
            build/linux-x64/bin/minebackup-cli build/release \
            build/package-inputs/linux-gcc-x64.zip "$VERSION"
          test -f "build/release/MineBackup-CLI-${VERSION}-linux-x64.tar.gz"
          test -f "build/release/minebackup-cli_${VERSION}_amd64.deb"

      - name: Verify package dependency declarations
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          dpkg-deb --contents "build/release/minebackup_${VERSION}_amd64.deb"
          dpkg-deb --field "build/release/minebackup_${VERSION}_amd64.deb" Depends | tee build/release/deb-depends.txt
          mkdir -p build/release/deb-extract
          dpkg-deb --extract "build/release/minebackup_${VERSION}_amd64.deb" build/release/deb-extract
          ldd build/release/deb-extract/usr/bin/MineBackup | tee build/release/deb-ldd.txt
          ! grep -F 'not found' build/release/deb-ldd.txt

      - name: Create Linux cross-restore fixtures
        run: |
          mkdir -p build/cross-restore
          unzip -p build/package-inputs/linux-gcc-x64.zip 7zz >build/cross-restore/7zz
          chmod 0755 build/cross-restore/7zz
          printf %s 'MineBackup 1.16 cross-restore fixture: linux' >build/cross-restore/linux.txt
          build/cross-restore/7zz a -y -t7z -m0=lzma2 \
            build/cross-restore/linux-lzma2.7z build/cross-restore/linux.txt
          build/cross-restore/7zz a -y -t7z -m0=zstd \
            build/cross-restore/linux-zstd.7z build/cross-restore/linux.txt

      - name: Upload Linux release candidates
        uses: actions/upload-artifact@v4
        with:
          name: minebackup-linux-candidates
          if-no-files-found: error
          retention-days: 14
          path: |
            build/release/minebackup_${{ steps.version.outputs.version }}_amd64.deb
            build/release/MineBackup-${{ steps.version.outputs.version }}-x86_64.AppImage
            build/release/MineBackup-CLI-${{ steps.version.outputs.version }}-linux-x64.tar.gz
            build/release/minebackup-cli_${{ steps.version.outputs.version }}_amd64.deb
            build/release/deb-depends.txt
            build/release/deb-ldd.txt

      - name: Upload Linux cross-restore fixtures
        uses: actions/upload-artifact@v4
        with:
          name: minebackup-linux-restore-fixtures
          path: build/cross-restore
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
